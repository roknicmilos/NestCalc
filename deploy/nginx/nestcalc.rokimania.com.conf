server {
    server_name nestcalc.rokimania.com;

    # The API has no authentication of its own, so everything sits behind basic auth by default;
    # the only exemption is the block below.
    auth_basic "NestCalc";
    auth_basic_user_file /etc/nginx/.htpasswd-nestcalc;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Chrome fetches the manifest (and the service worker, icons and offline page) without
    # credentials. If these were behind auth the app would not be installable. None of them
    # contains user data.
    location ~ ^/(manifest\.webmanifest|sw\.js|offline\.html|icons/.*)$ {
        auth_basic off;

        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next fingerprints everything under /_next/static/, so it can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    listen 80;
}
